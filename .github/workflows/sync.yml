name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 4 * * *"  # Every day at 04:00 UTC (12:00 UTC+8)
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork || github.repository == 'zzz7491/LibreTV' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/LibreSpark/LibreTV.git || true
          git fetch upstream main

      - name: Merge upstream changes
        run: |
          git checkout main
          git merge --no-edit upstream/main || {
            echo "Merge conflict detected. Manual review is required."
            exit 1
          }

      - name: Push updates
        run: |
          git push origin main

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] Upstream sync failed. Please inspect the workflow logs and resolve conflicts manually."
          exit 1
